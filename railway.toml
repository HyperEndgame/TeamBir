[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.toml"
buildCommand = "pnpm build"

[deploy]
startCommand = "pnpm --dir apps/web exec next start -H 0.0.0.0 -p $PORT"
healthcheckPath = "/"
healthcheckTimeout = 30

[environments.production]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "20"
